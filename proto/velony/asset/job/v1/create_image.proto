syntax = "proto3";

package velony.asset.job.v1;

option go_package = "github.com/velonyapp/asset/gen/job/v1;jobv1";

message CreateImagePayload {
  enum Format {
    FORMAT_UNSPECIFIED = 0;

    JPEG = 1;
    PNG  = 2;
    WEBP = 3;
    AVIF = 4;
  }

  repeated string     tags     = 1;
  map<string, string> metadata = 2;

  string object_key = 3;

  uint32 width  = 4;
  uint32 height = 5;
  Format format = 6;
}
