
syntax = "proto3";

package velony.asset.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/asset/gen/api/v1;apiv1";

// Provides image management and processing operations.
service AssetService {
  option (google.api.default_host) = "api.velony.app";

  // Retrieves an image by resource name.
  rpc GetImage(GetImageRequest) returns (Image) {
    option (google.api.http) = {
      get: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new image.
  rpc CreateImage(CreateImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/images"
      body: "image"
    };
    option (google.api.method_signature) = "image";
  }

  // Deletes an image.
  rpc DeleteImage(DeleteImageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Confirms an image after a successful upload.
  rpc ConfirmImage(ConfirmImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:confirm"
      body: "*"
    };
  }

  // Processes an image.
  rpc ProcessImage(ProcessImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:process"
      body: "*"
    };
  }
}

message Image {
  // The processing state of an image.
  enum State {
    // The image state is unspecified.
    STATE_UNSPECIFIED = 0;

    // The image is awaiting an upload.
    AWAITING_UPLOAD = 1;

    // The image is awaiting processing.
    PENDING = 2;

    // The image is being processed.
    PROCESSING = 3;

    // The image is active.
    ACTIVE = 4;
  }

  // The encoding format of an image.
  enum Format {
    // The image format is unspecified.
    FORMAT_UNSPECIFIED = 0;

    // JPEG image format.
    JPEG = 1;

    // PNG image format.
    PNG = 2;

    // WebP image format.
    WEBP = 3;

    // AVIF image format.
    AVIF = 4;
  }

  option (google.api.resource) = {
    type    : "api.velony.app/Image"
    pattern : "images/{image}"
    singular: "image"
    plural  : "images"
  };

  // The resource name of the image.
  //
  // Format: `images/{image}`
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The tags associated with the image.
  repeated string tags = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The metadata associated with the image.
  map<string, string> metadata = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The object key used to store the image.
  string object_key = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The current state of the image.
  State state = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The width of the image in pixels.
  int32 width_px = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The height of the image in pixels.
  int32 height_px = 7 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The format of the image.
  Format format = 8 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The time when the image was created.
  google.protobuf.Timestamp create_time = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The URL to upload the image, if available.
  optional string upload_url = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The URL to download the image, if available.
  optional string download_url = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message GetImageRequest {
  // The image to retrieve.
  //
  // Format: `images/{image}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message CreateImageRequest {
  // The image to create.
  Image image = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message DeleteImageRequest {
  // The image to delete.
  //
  // Format: `images/{image}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message ConfirmImageRequest {
  // The image to confirm.
  //
  // Format: `images/{image}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message ProcessImageRequest {
  // The image to process.
  //
  // Format: `images/{image}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}
