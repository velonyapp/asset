syntax = "proto3";

package velony.asset.api.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/api/client.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/velonyapp/asset/gen/api/v1;apiv1";

service AssetService {
  option (google.api.default_host) = "api.velony.app";

  rpc GetImage(GetImageRequest) returns (Image) {
    option (google.api.http) = {
      get: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc CreateImage(CreateImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/images"
      body: "image"
    };
    option (google.api.method_signature) = "image";
  }

  rpc ConfirmImage(ConfirmImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:confirm"
      body: "*"
    };
  }

  rpc ProcessImage(ProcessImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:process"
      body: "*"
    };
  }

  rpc DeleteImage(DeleteImageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

message ImageResize {
  enum Fit {
    FIT_UNSPECIFIED = 0;

    CONTAIN = 1;
    COVER   = 2;
    PAD     = 3;
    STRETCH = 4;
  }

  enum Gravity {
    GRAVITY_UNSPECIFIED = 0;

    CENTER       = 1;
    TOP          = 2;
    TOP_RIGHT    = 3;
    RIGHT        = 4;
    BOTTOM_RIGHT = 5;
    BOTTOM       = 6;
    BOTTOM_LEFT  = 7;
    LEFT         = 8;
    TOP_LEFT     = 9;
  }

  optional uint32 width = 1 [
    (google.api.field_behavior) = OPTIONAL
  ];
  optional uint32 height = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];

  Fit fit = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];
  Gravity gravity = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];

  optional string background_color = 5 [
    (google.api.field_behavior) = OPTIONAL
  ];

  bool allow_upscale = 6 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ImageEncoding {
  enum Format {
    FORMAT_UNSPECIFIED = 0;

    JPEG = 1;
    PNG  = 2;
    WEBP = 3;
    AVIF = 4;
  }

  Format format = 1 [
    (google.api.field_behavior) = OPTIONAL
  ];

  optional uint32 quality = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message Image {
  enum State {
    STATE_UNSPECIFIED = 0;

    PENDING    = 1;
    UPLOADED   = 2;
    PROCESSING = 3;
    ACTIVE     = 4;
  }

  option (google.api.resource) = {
    type    : "api.velony.app/Image"
    pattern : "images/{image}"
    singular: "image"
    plural  : "images"
  };

  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  repeated string tags = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  string object_key = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  State state = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  google.protobuf.Timestamp create_time = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  google.protobuf.Timestamp update_time = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  optional string upload_url = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message GetImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message CreateImageRequest {
  Image image = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message ConfirmImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message ProcessImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];

  ImageResize resize = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
  ImageEncoding encoding = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];
  bool auto_rotate = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];
  bool remove_metadata = 5 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message DeleteImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}
