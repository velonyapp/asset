syntax = "proto3";

package velony.asset.api.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/asset/gen/api/v1;apiv1";

service AssetService {
  rpc PresignImage(PresignImageRequest)
  returns (PresignImageResponse) {
    option (google.api.http) = {
      post: "/v1:presignImage"
      body: "*"
    };
  }

  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse) {
    option (google.api.http) = {
      post: "/v1/images:upload"
      body: "image"
    };
  }

  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse) {
    option (google.api.http) = {
      post: "/v1:removeImage"
      body: "*"
    };
  }
}

enum ImageResizeFit {
  IMAGE_RESIZE_FIT_UNSPECIFIED = 0;
  IMAGE_RESIZE_FIT_CONTAIN     = 1;
  IMAGE_RESIZE_FIT_COVER       = 2;
}

message ImageResizeOptions {
  uint32 width  = 1 [(google.api.field_behavior) = REQUIRED];
  uint32 height = 2 [(google.api.field_behavior) = REQUIRED];

  ImageResizeFit fit = 3 [(google.api.field_behavior) = REQUIRED];
}

message PresignImageRequest {
  string storage_key = 1 [(google.api.field_behavior) = REQUIRED];

  ImageResizeOptions resize_options = 2 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp expire_time = 3 [(google.api.field_behavior) = REQUIRED];
}

message PresignImageResponse {
  string upload_url = 1;
}

message UploadImageRequest {
  string token = 1 [(google.api.field_behavior) = REQUIRED];

  google.api.HttpBody image = 2 [(google.api.field_behavior) = REQUIRED];
}

message UploadImageResponse {
  string storage_key = 1;
}

message RemoveImageRequest {
  string storage_key = 1 [(google.api.field_behavior) = REQUIRED];
}

message RemoveImageResponse {}