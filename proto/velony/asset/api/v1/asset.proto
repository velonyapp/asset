syntax = "proto3";

package velony.asset.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/asset/gen/api/v1;apiv1";

service AssetService {
  option (google.api.default_host) = "api.velony.app";

  rpc GetImage(GetImageRequest) returns (Image) {
    option (google.api.http) = {
      get: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc CreateImage(CreateImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/images"
      body: "image"
    };
    option (google.api.method_signature) = "image";
  }

  rpc DeleteImage(DeleteImageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=images/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc ConfirmImage(ConfirmImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:confirm"
      body: "*"
    };
  }

  rpc ProcessImage(ProcessImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1/{name=images/*}:process"
      body: "*"
    };
  }
}

message Image {
  enum State {
    STATE_UNSPECIFIED = 0;

    AWAITING_UPLOAD = 1;
    PENDING         = 2;
    PROCESSING      = 3;
    ACTIVE          = 4;
  }

  enum Format {
    FORMAT_UNSPECIFIED = 0;

    JPEG = 1;
    PNG  = 2;
    WEBP = 3;
    AVIF = 4;
  }

  option (google.api.resource) = {
    type    : "api.velony.app/Image"
    pattern : "images/{image}"
    singular: "image"
    plural  : "images"
  };

  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  repeated string tags = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  map<string, string> metadata = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  string object_key = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  State state = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  uint32 width = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  uint32 height = 7 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  Format format = 8 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  google.protobuf.Timestamp create_time = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  optional string upload_url = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  optional string download_url = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message GetImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message CreateImageRequest {
  Image image = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message DeleteImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message ConfirmImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}

message ProcessImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Image"
    }
  ];
}
