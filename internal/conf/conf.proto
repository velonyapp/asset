syntax = "proto3";
package kratos.api;

option go_package = "github.com/velonyapp/asset/internal/conf";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

message Bootstrap {
  Transport transport = 1 [
    (buf.validate.field).required = true
  ];
  Data data = 2 [
    (buf.validate.field).required = true
  ];
  Telemetry telemetry = 3;
}

message Transport {
  message HTTP {
    string address = 1 [
      (buf.validate.field).string.host_and_port = true
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).duration.gt = {}
    ];
  }

  message GRPC {
    string address = 1 [
      (buf.validate.field).string.host_and_port = true
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).duration.gt = {}
    ];
  }

  message RabbitMQ {
    message Queues {
      string create_image = 1 [
        (buf.validate.field).string.min_len = 1
      ];
      string process_image = 2 [
        (buf.validate.field).string.min_len = 1
      ];
      string reconcile_image = 3 [
        (buf.validate.field).string.min_len = 1
      ];
      string delete_image = 4 [
        (buf.validate.field).string.min_len = 1
      ];
    }

    string address = 1 [
      (buf.validate.field).string.min_len = 1
    ];
    string username = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    string password = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    Queues queues = 4 [
      (buf.validate.field).required = true
    ];
  }

  HTTP http = 1 [
    (buf.validate.field).required = true
  ];
  GRPC grpc = 2 [
    (buf.validate.field).required = true
  ];
  RabbitMQ rabbitmq = 3 [
    (buf.validate.field).required = true
  ];
}

message Data {
  message MySQL {
    string dsn = 1 [
      (buf.validate.field).string.min_len = 1
    ];

    optional uint32 max_open_connections = 2;
    optional uint32 max_idle_connections = 3;

    google.protobuf.Duration max_connection_lifetime = 4 [
      (buf.validate.field).duration.gte = {}
    ];

    option (buf.validate.message).cel = {
      id        : "mysql.pool_limits"
      message   : "max_idle_connections cannot exceed max_open_connections unless max_open_connections is 0"
      expression: "this.max_open_connections == 0u || this.max_idle_connections <= this.max_open_connections"
    };
  }

  message S3 {
    string endpoint = 1 [
      (buf.validate.field).string.min_len = 1
    ];
    string access_key_id = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    string secret_access_key = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    string bucket = 4 [
      (buf.validate.field).string.min_len = 1
    ];
  }

  MySQL mysql = 1 [
    (buf.validate.field).required = true
  ];
  S3 s3 = 2 [
    (buf.validate.field).required = true
  ];
}

message Telemetry {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    GRPC                 = 1;
    HTTP_PROTOBUF        = 2;
  }

  message Tracing {
    Protocol protocol = 1 [
      (buf.validate.field).enum = { defined_only: true, not_in: [0] }
    ];
    string endpoint = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    optional string authorization = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    optional double sample_ratio = 4 [
      (buf.validate.field).double = { gte: 0.0, lte: 1.0 }
    ];
  }

  message Metrics {
    Protocol protocol = 1 [
      (buf.validate.field).enum = { defined_only: true, not_in: [0] }
    ];
    string endpoint = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    optional string authorization = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    google.protobuf.Duration export_interval = 4 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  Tracing tracing = 1;
  Metrics metrics = 2;
}
